[project]
name = "orub"
version = "0.1.0"
description = "Personal vinyl collection tracker and track-compatibility graph tool."
readme = "README.md"
authors = [
    { name = "Akos Kadar", email = "akos.kadar@voize.de" }
]
requires-python = ">=3.12"
dependencies = [
    "attrs>=26.1.0",
]

[build-system]
requires = ["uv_build>=0.11.11,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.165.10",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short --cov=orub --cov-report=term-missing"

[tool.coverage.run]
source = ["orub"]
omit = ["*/tests/*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = [
    "I",      # isort
    "ERA001", # commented-out code
]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
