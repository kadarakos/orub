[project]
name = "orub"
version = "0.1.0"
description = "Personal vinyl collection tracker and track-compatibility graph tool."
readme = "README.md"
authors = [
    { name = "Akos Kadar", email = "akos.kadar@voize.de" }
]
requires-python = ">=3.12"
dependencies = [
    "attrs>=26.1.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "httpx2>=2.12.0",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pytesseract>=0.3.13",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.52",
    "typer>=0.27.2",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
orub = "orub.cli:app"

[build-system]
requires = ["uv_build>=0.11.11,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.165.10",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.16.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short --cov=orub --cov-report=term-missing"

[tool.coverage.run]
source = ["orub"]
omit = ["*/tests/*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = [
    "I",      # isort
    "ERA001", # commented-out code
]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
